server:
  port: 5001

spring:
  application:
    name: rest-api-app

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Ho_Chi_Minh

jwt:
  config:
    secret-key: a-very-long-secret-key-at-least-256-bits-long
